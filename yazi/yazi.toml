# Yazi UI / behaviour tweaks
[mgr]
show_hidden    = false      # press . inside yazi to toggle hidden files
sort_by        = "natural"  # 2 before 10
sort_dir_first = true       # folders on top
sort_sensitive = false
linemode       = "size"     # show file sizes on the right
show_symlink   = true
ratio          = [1, 3, 4]  # parent | current | preview column widths

[preview]
tab_size   = 2
max_width  = 900
max_height = 1200

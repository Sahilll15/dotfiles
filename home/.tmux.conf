# ~/.tmux.conf — Claude Code-friendly tmux config
# Prefix stays Ctrl-b (matches every tmux guide you'll read online).

# ── Claude Code compatibility (required) ──────────────────────────────
# Lets Shift+Enter insert a newline, and lets Claude's desktop
# notifications / progress bar pass through tmux out to Ghostty.
set  -g  allow-passthrough on
set  -s  extended-keys on
set  -as terminal-features 'xterm*:extkeys'

# ── True color to match Ghostty ───────────────────────────────────────
set  -g  default-terminal "tmux-256color"
set  -as terminal-features ",xterm-ghostty:RGB"

# ── Beginner quality-of-life ──────────────────────────────────────────
set  -g  mouse on              # click a pane to focus, scroll, drag borders to resize
set  -g  base-index 1          # number windows from 1
setw -g  pane-base-index 1
set  -g  renumber-windows on   # no gaps when you close a window
set  -g  history-limit 100000  # long scrollback
set  -sg escape-time 10        # snappy ESC (helps Claude input + vim)
set  -g  focus-events on

# ── Multi-client window sizing (Claude Code fix) ──────────────────────
# Size each window to the LARGEST attached client, not the most-recent one.
# Default `latest` means attaching a narrow terminal (e.g. a 76-col window)
# snaps the session down to 76 cols; Claude Code's TUI then repaints with
# ghost text / scattered spinner fragments. `largest` keeps a wide session
# wide even if a small client peeks at it. Revert with: set -g window-size latest
set  -g  window-size largest

# Pass the shell's title (folder + git branch, set in ~/.zshrc) through
# to Ghostty's titlebar instead of swallowing it.
set  -g  set-titles on
set  -g  set-titles-string "#T"

# ── Splits that keep your current folder ──────────────────────────────
# Prefix then | = side-by-side, prefix then - = top/bottom.
# (Default Ctrl-b % and Ctrl-b " still work too.)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"

# Create a NEW session (prompts for a name). Two ways:
#   Alt-n         — no prefix, no shift, the quick one (Left Option = Alt)
#   prefix then C — Ctrl-b Shift-C fallback
# (Default Ctrl-b c makes a new window, not a session.)
bind -n M-n command-prompt -p "new session:" "new-session -s '%%'"
bind    C   command-prompt -p "new session:" "new-session -s '%%'"

# Reload this file with: prefix then r
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# ── Vi-style scrollback & selection (added 2026-07-02) ────────────────
# Ctrl-b then [ enters copy mode. Then it behaves like vim:
#   h/j/k/l  move the cursor      v  start selection
#   J / K    page down / page up  y  copy selection to macOS clipboard
#   / and ?  search fwd / back    q  quit copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi J send -X page-down
bind -T copy-mode-vi K send -X page-up

# ── Status bar (colorblind-safe: blue accent, no red/green) ───────────
set -g status-style "fg=blue"
set -g status-left  "#[bold]  #S  "
set -g status-left-length 30
set -g status-right "%a %d %b  %H:%M "
set -g window-status-current-style "bold"

# ── Black + orange polish (added 2026-07-04) — matches Ghostty theme ──────
# Amber orange is CVD-safe (same accent as the Ghostty theme). Delete to revert.
set -g pane-border-lines heavy
set -g pane-active-border-style "fg=#fe8019"
set -g pane-border-style "fg=#3c3836"
set -g display-panes-active-colour "#fe8019"
set -g display-panes-colour "#665c54"
set -g clock-mode-colour "#fe8019"
set -g message-style "bg=#0d0f10,fg=#fe8019,bold"
set -g message-command-style "bg=#0d0f10,fg=#fabd2f"
set -g mode-style "bg=#fe8019,fg=#0d0f10"
set -g status-style "bg=#0d0f10,fg=#a89984"
set -g status-left "#[fg=#0d0f10,bg=#fe8019,bold]  #S  #[default] "
set -g status-left-length 40
set -g status-right "#[fg=#665c54]%a %d %b #[fg=#fe8019,bold] %H:%M "
set -g window-status-current-style "fg=#fe8019,bold"
set -g window-status-style "fg=#a89984"
set -g window-status-separator "  "
